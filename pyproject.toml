[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meok-cross-post"
version = "0.1.0"
description = "Audit + cross-post flagship MCP servers to Smithery, MCP Registry, Docker Catalog, Glama, MCPize, PulseMCP — one CLI for the whole directory ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "MEOK AI Labs", email = "nicholas@meok.ai"},
]
keywords = ["mcp", "model-context-protocol", "smithery", "glama", "mcp-registry", "docker-mcp-catalog", "mcpize", "pulsemcp", "directory", "scorecard", "audit", "openmcp", "meok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.0.0",
  "click>=8.1.0",
  "requests>=2.31.0",
  "pydantic>=2.5.0",
  "PyYAML>=6.0.1",
  "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "respx>=0.20",
  "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/meok-cross-post"
Repository = "https://github.com/CSOAI-ORG/meok-cross-post"
Issues = "https://github.com/CSOAI-ORG/meok-cross-post/issues"
PyPI = "https://pypi.org/project/meok-cross-post/"

[project.scripts]
meok-cross-post = "meok_cross_post.cli:main"
openmcp = "meok_cross_post.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["meok_cross_post"]
only-include = ["meok_cross_post"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--ignore=tests/fixtures"
