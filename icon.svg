<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="openMCP: audit checklist cross-posted to the directory network">
  <title>openMCP</title>
  <!-- Audit checklist card -->
  <rect x="6" y="14" width="26" height="36" rx="3" fill="#0e1726" stroke="#3da9fc" stroke-width="2.2"/>
  <!-- Checklist rows: passed ticks -->
  <g stroke="#3da9fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11 22 L13 24 L17 20"/>
    <path d="M11 31 L13 33 L17 29"/>
    <path d="M11 40 L13 42 L17 38"/>
  </g>
  <g stroke="#5b6b86" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="22" x2="28" y2="22"/>
    <line x1="20" y1="31" x2="28" y2="31"/>
    <line x1="20" y1="40" x2="28" y2="40"/>
  </g>
  <!-- Cross-post network: directory nodes the card fans out to -->
  <g stroke="#3da9fc" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="24" x2="50" y2="18"/>
    <line x1="32" y1="32" x2="54" y2="32"/>
    <line x1="32" y1="40" x2="50" y2="46"/>
  </g>
  <circle cx="52" cy="17" r="4" fill="#3da9fc"/>
  <circle cx="56" cy="32" r="4" fill="#3da9fc"/>
  <circle cx="52" cy="47" r="4" fill="#3da9fc"/>
</svg>
