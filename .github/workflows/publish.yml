name: publish

# PyPI publish for meok-cross-post.
# On `release: published`, build a wheel + sdist and push to PyPI via
# the trusted-publisher OIDC flow (no API token in repo secrets).
# Auth is configured at https://pypi.org/manage/account/publishing/ as
# "pending publisher" with owner=CSOAI-ORG, repo=meok-cross-post, workflow=publish.yml.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write    # required for PyPI trusted publishing

jobs:
  build-and-publish:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
