name: Test MCP Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install mcp>=1.0.0 pytest

      - name: Syntax check
        run: python -c "import py_compile; py_compile.compile('server.py', doraise=True)"

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found"

  e2e:
    name: e2e (boot streamable-http server + call every tool)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e . 2>/dev/null || pip install -e ".[dev]" 2>/dev/null || true
          pip install mcp

      - name: Boot server.py and exercise every tool over streamable-HTTP
        run: python tests/e2e_server.py
